<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Don't Waste Your Money logo">
  <title>Don't Waste Your Money — shield with dollar sign and verified check</title>
  <!-- Shield: protection — "protect your money, don't waste it." Optic-yellow shield pops on the navy header; navy $ + navy seal keep the brand two-tone. Flat vector, no gradients. -->
  <path d="M32 3 L55 9.5 V28 C55 44.5 45.5 54.5 32 61 C18.5 54.5 8.5 44.5 8.5 28 V9.5 Z" fill="#D8E31E" stroke="#0A1B31" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Dollar sign: single bold glyph, system font for reliable render at every size -->
  <text x="32" y="42.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900" fill="#0A1B31">$</text>
  <!-- Verified check seal: no waste, thesis checked. Navy badge + yellow check, straddling the shield edge. -->
  <circle cx="47" cy="47" r="10.5" fill="#0A1B31" stroke="#D8E31E" stroke-width="1.5"/>
  <path d="M41.5 47 L45.5 51 L52.5 42.5" fill="none" stroke="#D8E31E" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
